backend l1_auth_api_SIT_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_auth_api_SIT 1 l1_auth_api_SIT:5000 check resolvers docker init-addr none

backend l1_auth_api_UAT_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_auth_api_UAT 1 l1_auth_api_UAT:5000 check resolvers docker init-addr none
