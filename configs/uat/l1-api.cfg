backend l1_game_api_SIT_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_api_SIT_ 2 l1_game_api_SIT:5000 check resolvers docker init-addr none

