

backend pentagon_l1_fortune_cat_service_UAT_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/uat/fortunecat[/]?,/)]
    server-template l1_fortune_cat_service_UAT_ 1 l1_fortune_cat_service_UAT:5000 check resolvers docker init-addr none

