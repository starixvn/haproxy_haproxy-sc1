backend l1_game_client_SIT_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_client_SIT_ 2 l1_game_client_SIT:80 check resolvers docker init-addr none

