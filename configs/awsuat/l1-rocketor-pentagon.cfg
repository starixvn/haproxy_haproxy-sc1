backend pentagon_l1_blockchain_baccarat_client_AWSUAT_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/uat/game-client-48[/]?,/)]
    server-template l1_blockchain_baccarat_client_AWSUAT_ 1 l1_blockchain_baccarat_client_AWSUAT:80 check resolvers docker init-addr none

