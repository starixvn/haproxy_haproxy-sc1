

########

backend pentagon_l1_instant_game_client_AWSUAT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template l1_instant_game_client_AWSUAT_ 1 l1_instant_game_client_AWSUAT:80 check resolvers docker init-addr none

