
frontend l1_auth_api_PROD_fe
    bind *:8303
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    default_backend l1_auth_api_PROD_be

backend l1_auth_api_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_auth_api_PROD_ 2 l1_auth_api_PROD:5000 check resolvers docker init-addr none
