

backend pentagon_l1_website1_PROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    timeout server 1m
    option httpchk GET /
    http-check expect status 200
    server-template l1_website1_PROD_ 2 l1_website1_PROD:5000 check resolvers docker init-addr none

backend pentagon_l1_dragon_tiger_fight_client_PROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/site-67[/]?,/)]
    server-template l1_dragon_tiger_fight_client_PROD_ 2 l1_dragon_tiger_fight_client_PROD:80 check resolvers docker init-addr none

