
frontend l1_game_client_PROD_fe
    bind *:8100
    mode  http
    option forwardfor
    default_backend l1_game_client_PROD_be

backend l1_game_client_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_client_PROD_ 2 l1_game_client_PROD:80 check resolvers docker init-addr none

backend l1_game_client_mobi_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-response set-header Cache-Control public,max-age=31536000
    server-template l1_game_client_mobi_PROD_ 1 l1_game_client_mobi_PROD:5000 check resolvers docker init-addr none

backend l1_treasure_island_client_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/game-client-47/,/)]
    server-template l1_treasure_island_client_PROD_ 1 l1_treasure_island_client_PROD:80 check resolvers docker init-addr none

backend l1_blockchain_baccarat_client_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/game-client-48/,/)]
    server-template l1_blockchain_baccarat_client_PROD_ 1 l1_blockchain_baccarat_client_PROD:80 check resolvers docker init-addr none
