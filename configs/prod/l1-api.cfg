
frontend l1_game_api_PROD_fe
    bind *:8300
    mode  http
    option forwardfor
    default_backend l1_game_api_PROD_be

backend l1_game_api_nodes_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_api_PROD_ 2 l1_game_api_PROD:5000 check resolvers docker init-addr none
