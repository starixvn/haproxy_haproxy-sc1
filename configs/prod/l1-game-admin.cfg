
frontend l1_game_admin_site_PROD_fe
    bind *:8301
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    default_backend l1_game_admin_site_PROD_be

backend l1_game_admin_site_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_admin_site_PROD_ 1 l1_admin_site_PROD:5000 check resolvers docker init-addr none

frontend l1_game_admin_api_PROD_fe
    bind *:8304
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    default_backend l1_game_admin_api_PROD_be

backend l1_game_admin_api_PROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_admin_api_PROD_ 1 l1_admin_api_PROD:5000 check resolvers docker init-addr none
