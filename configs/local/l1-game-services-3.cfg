backend l1_socket_gateway_LOCAL_3_be
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_socket_gateway_LOCAL_3_ 1 l1_socket_gateway_LOCAL_3:5000 check resolvers docker init-addr none

backend l1_game_server_LOCAL_3_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/main/,/)]
    server-template l1_game_server_LOCAL_3_ 1 l1_game_server_LOCAL_3:5000 check resolvers docker init-addr none

