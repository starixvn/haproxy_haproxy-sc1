#
frontend nexops_test_services_fe
    bind *:7777
    mode  http
    option forwardfor
    use_backend %[path,map_beg(/etc/haproxy/maps/testing_proxy.map)] if { hdr(host) -i testing.lumigame.com:7777 }
default_backend nexops_test_services_be

backend nexops_test_services_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template l1_website1_LOCAL_ 3 l1_website1_LOCAL:5000 check resolvers docker init-addr none

backend nexops_test_services2_be
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me be_static"

backend nexops_test_services3_be
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me be_api"
