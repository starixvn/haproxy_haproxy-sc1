#
frontend nexops_test_services_fe
    bind *:7777
    mode  http
    option forwardfor
default_backend nexops_test_services_be4

backend nexops_test_services_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template l1_website1_LOCAL_ 3 l1_website1_LOCAL:5000 check resolvers docker init-addr none
