

backend pentagon_l1_dragon_tiger_client_test_LOCAL_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/poc-game-client-1[/]?,/)]
    server-template l1_dragon_tiger_client_test_LOCAL_ 1 l1_dragon_tiger_client_test_LOCAL:80 check resolvers docker init-addr none

