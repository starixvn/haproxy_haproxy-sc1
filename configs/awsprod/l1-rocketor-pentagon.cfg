

########

backend pentagon_l1_website1_AWSPROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    timeout server 1m
    option httpchk GET /
    http-check expect status 200
    server-template l1_website1_AWSPROD_ 1 l1_website1_AWSPROD:5000 check resolvers docker init-addr none

backend pentagon_l1_app_download_site_client_AWSPROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template l1_app_download_site_client_AWSPROD_ 2 l1_app_download_site_client_AWSPROD:5000 check resolvers docker init-addr none

backend pentagon_l1_fantan_client_AWSPROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/game-client-60[/]?,/)]
    server-template l1_fantan_client_AWSPROD_ 2 l1_fantan_client_AWSPROD:80 check resolvers docker init-addr none

