backend pentagon_l1_dragon_tiger_fight_client_SGLOCAL_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/site-67[/]?,/)]
