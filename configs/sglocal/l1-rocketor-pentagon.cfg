

backend pentagon_l1_website1_SGLOCAL_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template l1_website1_SGLOCAL_ 1 l1_website1_SGLOCAL:5000 check resolvers docker init-addr none

backend pentagon_l1_dragon_tiger_fight_client_SGLOCAL_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/site-67[/]?,/)]
    server-template l1_dragon_tiger_fight_client_SGLOCAL_ 1 l1_dragon_tiger_fight_client_SGLOCAL:80 check resolvers docker init-addr none
