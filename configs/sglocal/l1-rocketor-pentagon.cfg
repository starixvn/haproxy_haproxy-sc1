

backend pentagon_l1_website1_SGLOCAL_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template l1_website1_SGLOCAL_ 1 l1_website1_SGLOCAL:5000 check resolvers docker init-addr none

