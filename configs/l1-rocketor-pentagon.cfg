

backend pentagon_l1_tolgee_auto_LOCAL_1_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,regsub(^/tolgeeauto[/]?,/,i)]
    server-template l1_tolgee_auto_LOCAL_1_ 1 l1_tolgee_auto_LOCAL_1:5000 check resolvers docker init-addr none
