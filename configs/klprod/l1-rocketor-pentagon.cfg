

backend pentagon_l1_direct_marble_football_2_client_KLPROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,regsub(^/direct-client-114[/]?,/,i)]
    server-template l1_direct_marble_football_2_client_KLPROD_ 2 l1_direct_marble_football_2_client_KLPROD:80 check resolvers docker init-addr none

